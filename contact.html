<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova análise | MLib</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link" aria-label="MLib, página inicial">
            <img src="images/mlib-icon.svg" alt="" height="32"><span>MLib</span>
        </a>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="about.html">Sobre o filme</a></li>
                <li><a href="contact.html" aria-current="page">Nova análise</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-page-container" aria-labelledby="form-title">
            <h1 id="form-title">Nova análise</h1>
            <form class="form-container" action="contact.html" method="get">
                <div class="form-group">
                    <label for="movie-name">Nome do filme</label>
                    <input type="text" id="movie-name" name="filme" required placeholder="Digite o nome do filme">
                </div>
                <div class="form-group">
                    <label for="nome">Seu nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label for="email">Seu e-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>
                <div class="form-group">
                    <label for="review-text">Análise</label>
                    <textarea id="review-text" rows="5" name="mensagem" required placeholder="Escreva sua opinião sobre o filme"></textarea>
                </div>
                <div class="form-group">
                    <label for="poster-url">URL do cartaz (opcional)</label>
                    <input type="url" id="poster-url" name="cartaz" placeholder="https://exemplo.com/cartaz.jpg">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="rating-select">Nota</label>
                        <select id="rating-select" name="nota" required>
                            <option value="">Escolha uma nota</option>
                            <option value="1">1 estrela</option><option value="2">2 estrelas</option>
                            <option value="3">3 estrelas</option><option value="4">4 estrelas</option>
                            <option value="5">5 estrelas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="watched-date">Data em que assistiu</label>
                        <input type="date" id="watched-date" name="data">
                    </div>
                </div>
                <button type="submit" class="submit-button">Enviar análise</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Este formulário é demonstrativo. Use dados fictícios: as informações serão exibidas no endereço do navegador após o envio e não serão armazenadas nem encaminhadas.</p>
        <p>&copy; 2026 MLib — Minha Biblioteca de Filmes</p>
    </footer>
</body>
</html>
