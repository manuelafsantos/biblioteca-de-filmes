<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Minha Biblioteca de Livros - Home </title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <div>
                <img src="images/mlib-icon.svg" alt="MLib Logo Icon" height="32">
                <span>MLib</span>
            </div>
            <nav>
                <button class="add-button" aria-label="Adicione nova review">+</button>
            </nav>
        </header>

        <main>
            <h1>Minhas Reviews de Filmes</h1>
            <div class="movie-card">
                <img src="https://placehold.co/200x300" alt="Poster do Filme">
                <h2>The Dark Knight</h2>
                <div class="rating">
                    <span>★</span>
                    <span>★</span>
                    <span>★</span>
                    <span>★</span>
                    <span class="star-empty">★</span>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 MLib &ndash; My Movie Library</p>
        </footer>
    </body>
</html>
