<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Adicione uma nova análise</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>

    <body>
        <header>
            <a href="../index.html" class="logo-link">
                <div>
                    <img src="../images/mlib-icon.svg" alt="MLib Logo Icon" height="32">
                    <span>MLib</span>
                </div>
            </a>

            <nav>
                <button class="add-button" aria-label="Add new movie review">+</button>
            </nav>
        </header>

        <main>
            <div class="form-page-container">
                <h2>Nova Análise</h2>
                <div class="form-container">
                    <form>
                    <div class="form-group">
                        <label for="movie-name">Nome do Filme</label>
                        <input type="text" id="movie-name" placeholder="Digite o nome do filme">
                    </div>

                    <div class="form-group">
                        <label for="poster-url">URL do Poster</label>
                        <input type="text" id="poster-url" placeholder="Cole a URL da imagem (jpg ou png)">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                        <label for="rating-select">Estrelas</label>
                            <select id="rating-select">
                                <option value="">Escolha uma nota</option>
                                <option value="1">★☆☆☆☆ - 1 Estrela</option>
                                <option value="2">★★☆☆☆ - 2 Estrelas</option>
                                <option value="3">★★★☆☆ - 3 Estrelas</option>
                                <option value="4">★★★★☆ - 4 Estrelas</option>
                                <option value="5">★★★★★ - 5 Estrelas</option>
                            </select>
                        </div>


                        <div class="form-group">
                            <label for="watched-date">Data de Visualização</label>
                            <input type="date" id="watched-date">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="review-text">Minha Análise</label>
                        <textarea id="review-text" rows="5" placeholder="Escreva suas ideias aqui..."></textarea>
                    </div>

                    <button type="submit" class="submit-button">Add</button>

                    </form>
                </div>
            </div>

        </main>

        <footer>
            <p>&copy; 2025 MLib &ndash; My Movie Library</p>
        </footer>
    </body>

</html>
