<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Análise de filme</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>

    <body>
        <header>
            <a href="../index.html" class="logo-link">
                <div>
                    <img src="../images/mlib-icon.svg" alt="MLib Logo Icon" height="32">
                    <span>MLib</span>
                </div>
            </a>

            <nav>
                <a href="add-review.html">
                    <button class="add-button" aria-label="Adicionar nova análise">+</button>
                </a>
            </nav>
        </header>

        <main>
            <div class="movie-details-container">

                <div class="movie-poster">
                    <img src="https://placehold.co/380x570" alt="Poster do filme">
                </div>

                <div class="movie-details-info">
                    <h1 class="movie-title">Jogos Vorazes: Em Chamas</h1>

                    <div class="movie-section">
                        <p><strong>Visto em:</strong> 08/09/2026</p>
                    </div>

                    <div class="movie-section rating-details">
                        <p><strong>Nota:</strong></p>
                        <div class="rating">
                            <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                        </div>
                    </div>

                    <div class="movie-section">
                        <p class="review-title"><strong>Análise:</strong></p>
                        <p>O melhor filme de todos os tempos. Finnick e Petta são os melhores personagens criados na história do cinema. </p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 MLib &ndash; My Movie Library</p>
        </footer>
    </body>

</html>
